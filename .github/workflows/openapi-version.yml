name: OpenAPI Version

# Auto-bumps the project version whenever the public OpenAPI/Swagger schema
# changes, and triggers a Docker rebuild by pushing the version commit.
#
#   * patch — descriptions, examples, response tweaks
#   * minor — new endpoints / new optional fields
#   * major — removed endpoints / removed required fields
#
# On `pull_request`: verifies that docs/openapi.json matches the running app schema
# via 'scripts/openapi.py check'; fails if the snapshot is missing or stale.
# On `push` to main: writes the new version + snapshot back to the branch.

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "pyproject.toml"
      - "uv.lock"
      - "scripts/openapi.py"
      - ".github/workflows/openapi-version.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "pyproject.toml"
      - "uv.lock"
      - "scripts/openapi.py"
      - ".github/workflows/openapi-version.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: true

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.13"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --locked

      - name: OpenAPI snapshot freshness check (PR)
        if: github.event_name == 'pull_request'
        run: uv run python scripts/openapi.py check

      - name: Bump version on OpenAPI change (main)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          uv run python scripts/openapi.py bump
          uv lock

      - name: Commit and push version bump
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          if git diff --quiet -- pyproject.toml uv.lock docs/openapi.json; then
            echo "No version change required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          NEW_VERSION=$(grep -m1 '^version' pyproject.toml | sed -E 's/version *= *"([^"]+)"/\1/')
          git add pyproject.toml uv.lock docs/openapi.json
          git commit -m "chore(openapi): bump version to ${NEW_VERSION} [skip ci]"
          git tag "v${NEW_VERSION}"
          git push origin HEAD:${GITHUB_REF#refs/heads/}
          git push origin "v${NEW_VERSION}"
