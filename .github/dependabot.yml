version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      sqlalchemy:
        patterns:
          - "sqlalchemy*"
      fastapi:
        patterns:
          - "fastapi*"
      pydantic:
        patterns:
          - "pydantic*"
      other:
        patterns:
          - "*"
        exclude-patterns:
          - "sqlalchemy*"
          - "fastapi*"
          - "pydantic*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # reserved for larchanka-training/dmc-1-t2-notebook-mono#267
      - dependency-name: "sqlalchemy"
        versions: [">= 2.1"]
